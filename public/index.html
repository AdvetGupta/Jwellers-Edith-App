<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#c59b27">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Jwellers Edith — Mobile Companion</title>
  <style>
    :root {
      --primary: #c59b27;
      --primary-dark: #9a7818;
      --primary-light: #fdf8e9;
      --bg-app: #f1f4f8;
      --bg-card: #ffffff;
      --text-main: #1a202c;
      --text-muted: #718096;
      --border: #e2e8f0;
      --success: #27ae60;
      --danger: #e53e3e;
      --warning: #dd6b20;
      --info: #3182ce;
      --radius: 14px;
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
      --shadow: 0 6px 16px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: #e2e8f0; color: var(--text-main); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
    
    #mobile-frame {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background: var(--bg-app);
      position: relative;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      padding-bottom: 75px;
    }

    .app-header {
      position: sticky; top: 0;
      background: var(--bg-card);
      padding: 12px 18px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .app-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; color: var(--primary-dark); }
    .sync-status-pill {
      font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 20px;
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      background: #e6fffa; color: #234e52; border: 1px solid #b2f5ea;
    }
    .sync-status-pill.unpaired { background: #edf2f7; color: #4a5568; border-color: #cbd5e0; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
    .unpaired .dot { background: var(--text-muted); }

    .app-content { padding: 16px; flex: 1; overflow-y: auto; }

    .bottom-nav {
      position: fixed; bottom: 0; width: 100%; max-width: 440px;
      background: var(--bg-card); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 10px 0;
      z-index: 200; box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; border: none; background: none; color: var(--text-muted);
      font-size: 11px; font-weight: 700; cursor: pointer; flex: 1;
    }
    .nav-btn.active { color: var(--primary-dark); }
    .nav-btn .icon { font-size: 20px; }

    .card {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 16px; margin-bottom: 14px; border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .stat-card {
      background: var(--bg-card); padding: 14px; border-radius: var(--radius);
      border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    }
    .stat-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .stat-num { font-size: 20px; font-weight: 800; margin-top: 4px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 10px 16px; border-radius: 10px; font-size: 13px;
      font-weight: 700; border: none; cursor: pointer; text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:active { background: var(--primary-dark); }
    .btn-secondary { background: var(--bg-app); color: var(--text-main); border: 1px solid var(--border); }
    .btn-whatsapp { background: #25d366; color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-block { width: 100%; padding: 12px; font-size: 14px; }
    .search-input {
      width: 100%; padding: 12px 14px 12px 38px; border-radius: 10px;
      border: 1px solid var(--border); font-size: 14px; background: var(--bg-card); outline: none;
    }
    .search-input:focus { border-color: var(--primary); }

    .modal-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center;
      z-index: 500;
    }
    .modal-sheet {
      background: var(--bg-card); width: 100%; max-width: 440px;
      border-top-left-radius: 20px; border-top-right-radius: 20px;
      padding: 24px 20px 32px 20px; max-height: 88vh; overflow-y: auto;
      animation: slideIn 0.25s ease-out;
    }
    @keyframes slideIn { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .wizard-step { text-align: center; padding: 20px 0; }
    .wizard-icon { font-size: 54px; margin-bottom: 12px; }
    .wizard-title { font-size: 20px; font-weight: 800; color: var(--text-main); margin-bottom: 6px; }
    .wizard-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }
    .step-pill { display: inline-block; padding: 4px 12px; border-radius: 12px; background: var(--primary-light); color: var(--primary-dark); font-size: 11px; font-weight: 800; margin-bottom: 14px; }
    .progress-track { height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 16px 0; }
    .progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.4s ease; }

    .badge-jama { background: #e8f8f5; color: #27ae60; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .badge-bill { background: #feebc8; color: #c05621; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
  </style>
</head>
<body>
  <div id="mobile-frame"></div>
  <div id="modal-host"></div>

  <script>
    // --- Master Mobile State & Realistic Jewel Store Ledger ---
    const State = {

          ],

        }
      ],
      girviList: [
        {
          id: 1, loan_number: 'GIR-1001', customer_name: 'Ramesh Patel', father_husband_name: 'Dattatray',
          phone1: '9822112233', address: 'Indapur, Pune', item_name: 'Gold Chain 22K', metal_type: 'gold',
          gold_weight: 18.5, silver_weight: 0, principal_amount: 55000, monthly_interest_percent: 2.0,
          loan_date: '2026-06-10', reference_person: 'Suresh Sheth', notes: 'Pledged in original box',
          accruedDays: 80, accruedInterest: 2933, totalDues: 57933,
          payments: [
            { date: '2026-07-10', amount: 1100, type: 'interest_payment', mode: 'Cash', note: '1 month interest' }
          ]
        },
        {
          id: 2, loan_number: 'GIR-1002', customer_name: 'Sunita Sharma', father_husband_name: 'Jagdish',
          phone1: '9833445566', address: 'Baramati, Pune', item_name: 'Silver Payal 92.5%', metal_type: 'silver',
          gold_weight: 0, silver_weight: 250, principal_amount: 14000, monthly_interest_percent: 2.5,
          loan_date: '2026-07-01', reference_person: 'Govind Jewellers', notes: 'Pair of anklets with bells',
          accruedDays: 59, accruedInterest: 688, totalDues: 14688,
          payments: []
        },
        {
          id: 3, loan_number: 'GIR-1003', customer_name: 'Vijay Deshmukh', father_husband_name: 'Baburao',
          phone1: '9855667788', address: 'Phaltan, Satara', item_name: 'Gold Bangles (2)', metal_type: 'gold',
          gold_weight: 32.0, silver_weight: 0, principal_amount: 95000, monthly_interest_percent: 1.5,
          loan_date: '2026-05-15', reference_person: 'Maheshbhai', notes: 'Hallmarked 916 KDM',
          accruedDays: 106, accruedInterest: 5035, totalDues: 100035,
          payments: [
            { date: '2026-06-15', amount: 1425, type: 'interest_payment', mode: 'UPI', note: 'May-June interest' },
            { date: '2026-07-15', amount: 1425, type: 'interest_payment', mode: 'Cash', note: 'June-July interest' }
          ]
        }
      ],
      customers: [
        { id: 1, name: 'Ramesh Patel', phone: '9822112233', city: 'Indapur', balance: 18500 },
        { id: 2, name: 'Sunita Sharma', phone: '9833445566', city: 'Baramati', balance: 24000 },
        { id: 3, name: 'Anand Kumar', phone: '9844556677', city: 'Pune', balance: 9200 },
        { id: 4, name: 'Vijay Deshmukh', phone: '9855667788', city: 'Phaltan', balance: 45000 }
      ]
    };

    // --- Bilingual Dictionary ---
    const I18N = {
      t(k) {
        const dict = {
          en: {
            appName: "Jwellers Edith", dashboard: "Dashboard", khata: "Khata", girvi: "Girvi",
            customers: "Customers", settings: "Settings", pairPC: "Pair PC", connected: "Connected",
            goldRate: "Today Gold 22K (10g)", silverRate: "Today Silver (1kg)",
            activeKhataDues: "Active Khata Dues", activeGirvi: "Active Girvi",
            goldPledged: "Gold Pledged", silverPledged: "Silver Pledged",
            searchKhata: "Search customer or balance...", searchGirvi: "Search Girvi #, name, phone...",
            whatsappReminder: "WhatsApp", upiQr: "UPI QR", details: "Passbook", pay: "Pay", photo: "Photo"
          },
          hi: {
            appName: "ज्वेलर्स एडिथ", dashboard: "डैशबोर्ड", khata: "खाता", girvi: "गिरवी",
            customers: "ग्राहक", settings: "सेटिंग्स", pairPC: "पीसी जोड़ें", connected: "जुड़ा हुआ",
            goldRate: "आज सोना भाव (22K)", silverRate: "आज चांदी भाव (1kg)",
            activeKhataDues: "कुल खाता बकाया", activeGirvi: "सक्रिय गिरवी",
            goldPledged: "जमा सोना (ग्राम)", silverPledged: "जमा चांदी (ग्राम)",
            searchKhata: "ग्राहक या फोन नंबर खोजें...", searchGirvi: "गिरवी नं., नाम, फोन खोजें...",
            whatsappReminder: "व्हाट्सएप", upiQr: "UPI QR", details: "पासबुक", pay: "जमा लें", photo: "फोटो"
          }
        };
        return (dict[State.lang] && dict[State.lang][k]) || k;
      }
    };

    // --- Mobile Application Coordinator ---
    const MobileApp = {
      _wizardStep: 1,
      _searchFilter: '',

      init() {
        try {
          const saved = localStorage.getItem('je_mobile_state');
          if (saved) Object.assign(State, JSON.parse(saved));
        } catch(e) {}
        this.render();
      },

      saveState() {
        try {
          localStorage.setItem('je_mobile_state', JSON.stringify({
            isPaired: State.isPaired,
            accountEmail: State.accountEmail,
            pairingCode: State.pairingCode,
            shopUpiId: State.shopUpiId,
            lastSyncedAt: State.lastSyncedAt,
            lang: State.lang
          }));
        } catch(e) {}
      },

      navigate(screen) {
        State.currentScreen = screen;
        this._searchFilter = '';
        this.render();
        window.scrollTo(0, 0);
      },

      render() {
        const frame = document.getElementById('mobile-frame');
        if (!frame) return;

        if (!State.isPaired && !State.isDemoMode) {
          frame.innerHTML = this._renderOnboardingWizard();
          return;
        }

        frame.innerHTML = `
          <header class="app-header">
            <div class="app-logo">
              <span>💍</span> ${I18N.t('appName')}
            </div>
            <div class="sync-status-pill ${State.isPaired ? '' : 'unpaired'}" onclick="MobileApp.showSyncSheet()">
              <span class="dot"></span>
              <span>${State.isPaired ? I18N.t('connected') : I18N.t('pairPC')}</span>
            </div>
          </header>

          <main class="app-content">
            ${this._renderScreenContent()}
          </main>

          <nav class="bottom-nav">
            <button class="nav-btn ${State.currentScreen === 'dashboard' ? 'active' : ''}" onclick="MobileApp.navigate('dashboard')">
              <span class="icon">◉</span><span>${I18N.t('dashboard')}</span>
            </button>
            <button class="nav-btn ${State.currentScreen === 'khata' ? 'active' : ''}" onclick="MobileApp.navigate('khata')">
              <span class="icon">📒</span><span>${I18N.t('khata')}</span>
            </button>
            <button class="nav-btn ${State.currentScreen === 'girvi' ? 'active' : ''}" onclick="MobileApp.navigate('girvi')">
              <span class="icon">💍</span><span>${I18N.t('girvi')}</span>
            </button>
            <button class="nav-btn ${State.currentScreen === 'customers' ? 'active' : ''}" onclick="MobileApp.navigate('customers')">
              <span class="icon">👥</span><span>${I18N.t('customers')}</span>
            </button>
            <button class="nav-btn ${State.currentScreen === 'settings' ? 'active' : ''}" onclick="MobileApp.navigate('settings')">
              <span class="icon">⚙</span><span>${I18N.t('settings')}</span>
            </button>
          </nav>
        `;
      },

      _renderScreenContent() {
        switch(State.currentScreen) {
          case 'khata': return this._renderKhata();
          case 'girvi': return this._renderGirvi();
          case 'customers': return this._renderCustomers();
          case 'settings': return this._renderSettings();
          default: return this._renderDashboard();
        }
      },

      _renderDashboard() {
        const totalKhata = State.khataList.reduce((s, c) => s + (c.dues || 0), 0);
        const totalGirvi = State.girviList.reduce((s, g) => s + (g.principal_amount || 0), 0);
        const goldWt = State.girviList.reduce((s, g) => s + (g.gold_weight || 0), 0);
        const silverWt = State.girviList.reduce((s, g) => s + (g.silver_weight || 0), 0);

        return `
          <div class="card" style="background: linear-gradient(135deg, #fff 0%, #f8f9fa 100%); border-left: 4px solid var(--primary);">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-size:11px; font-weight:700; color:var(--primary);">${I18N.t('goldRate')}</div>
                <div style="font-size:18px; font-weight:800; margin-top:2px;">₹67,400</div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:11px; font-weight:700; color:var(--info);">${I18N.t('silverRate')}</div>
                <div style="font-size:18px; font-weight:800; margin-top:2px;">₹86,500</div>
              </div>
            </div>
          </div>

          <div class="stat-grid">
            <div class="stat-card" onclick="MobileApp.navigate('khata')" style="cursor:pointer;">
              <div class="stat-label">${I18N.t('activeKhataDues')}</div>
              <div class="stat-num" style="color:var(--danger)">₹${totalKhata.toLocaleString('en-IN')}</div>
              <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">${State.khataList.length} accounts</div>
            </div>
            <div class="stat-card" onclick="MobileApp.navigate('girvi')" style="cursor:pointer;">
              <div class="stat-label">${I18N.t('activeGirvi')}</div>
              <div class="stat-num" style="color:var(--primary)">₹${totalGirvi.toLocaleString('en-IN')}</div>
              <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">${State.girviList.length} pledges</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">${I18N.t('goldPledged')}</div>
              <div class="stat-num" style="color:var(--warning)">${goldWt.toFixed(2)}g</div>
              <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">In Vault</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">${I18N.t('silverPledged')}</div>
              <div class="stat-num" style="color:var(--info)">${silverWt.toFixed(2)}g</div>
              <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">In Vault</div>
            </div>
          </div>

          <div class="card" style="border: 1px dashed var(--border); display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="font-weight:700; font-size:13px;">☁️ Google Drive Free Sync</div>
              <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">
                ${State.isPaired ? `Connected: ${State.accountEmail || 'owner.jeweller@gmail.com'}` : 'Running in Demo Mode'}
              </div>
            </div>
            <button class="btn btn-sm btn-primary" onclick="MobileApp.showSyncSheet()">
              🔄 Sync
            </button>
          </div>
        `;
      },

      // --- Rich Khata Passbook Screen ---
      _renderKhata() {
        const q = this._searchFilter.toLowerCase();
        const filtered = State.khataList.filter(c => !q || c.name.toLowerCase().includes(q) || c.phone.includes(q) || c.city.toLowerCase().includes(q));

        return `
          <div style="position:relative; margin-bottom:14px;">
            <span style="position:absolute; left:12px; top:12px; color:var(--text-muted);">🔍</span>
            <input type="text" class="search-input" placeholder="${I18N.t('searchKhata')}" value="${this._searchFilter}" oninput="MobileApp._searchFilter = this.value; MobileApp.render();">
          </div>

          ${filtered.map(c => {
            const lastJama = c.jamaHistory && c.jamaHistory.length > 0 ? c.jamaHistory[c.jamaHistory.length - 1] : null;
            return `
              <div class="card" style="border-left: 4px solid var(--danger); cursor:pointer;" onclick="MobileApp.openKhataPassbook(${c.id})">
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                  <div>
                    <div style="font-weight:700; font-size:15px;">${c.name}</div>
                    <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">📍 ${c.city} • 📞 ${c.phone}</div>
                  </div>
                  <div style="text-align:right;">
                    <div style="font-size:11px; font-weight:700; color:var(--text-muted);">PENDING DUES</div>
                    <div style="font-size:18px; font-weight:800; color:var(--danger); margin-top:2px;">₹${c.dues.toLocaleString('en-IN')}</div>
                  </div>
                </div>

                <div style="background:var(--bg-app); padding:8px 12px; border-radius:8px; margin-top:10px; font-size:12px; display:flex; justify-content:space-between;">
                  <span>🛒 Purchases: <strong>₹${(c.totalPurchases || 0).toLocaleString('en-IN')}</strong></span>
                  <span>💰 Total Jama: <strong>₹${(c.totalJama || 0).toLocaleString('en-IN')}</strong></span>
                </div>

                ${lastJama ? `
                  <div style="font-size:11px; color:var(--text-muted); margin-top:6px;">
                    Last Jama: <strong style="color:var(--success);">₹${lastJama.amount.toLocaleString('en-IN')} (${lastJama.mode})</strong> on ${lastJama.date}
                  </div>
                ` : ''}

      submitGirviPayment(loanNo) {
        const amt = parseFloat(document.getElementById('pay-amount-input')?.value || 0);
        const mode = document.getElementById('pay-mode-select')?.value || 'Cash';
        const type = document.getElementById('pay-type-select')?.value || 'interest_payment';
        const g = State.girviList.find(x => x.loan_number === loanNo);
        if (g && amt > 0) {
          if (!g.payments) g.payments = [];
          g.payments.push({
            date: new Date().toISOString().split('T')[0],
            amount: amt,
            type,
            mode,
            note: 'Mobile app counter collection'
          });
          if (type === 'interest_payment') {
            g.accruedInterest = Math.max(0, (g.accruedInterest || 0) - amt);
          } else {
            g.principal_amount = Math.max(0, g.principal_amount - amt);
          }
          g.totalDues = g.principal_amount + (g.accruedInterest || 0);
          document.getElementById('girvi-pay-modal')?.remove();
          alert(`✅ Payment of ₹${amt.toLocaleString('en-IN')} recorded on Ticket #${loanNo} and queued for Google Drive Sync!`);
          this.render();
        }
      },

        const p = String(phone).replace(/\D/g, '');
        window.open(`https://api.whatsapp.com/send?phone=91${p}&text=${encodeURIComponent(msg)}`, '_blank');
      },

                <input type="email" id="wiz-email" class="search-input" style="padding-left:14px; margin-top:6px;" placeholder="owner.jeweller@gmail.com" value="owner.jeweller@gmail.com">
              </div>

              <button class="btn btn-primary btn-block" style="padding:14px;" onclick="MobileApp.startSyncProcess()">
                🚀 Connect & Sync Data
              </button>
              <button class="btn btn-secondary btn-block" style="margin-top:10px;" onclick="MobileApp._wizardStep = 1; MobileApp.render();">
                ← Back
              </button>
            </div>
          `;
        } else if (this._wizardStep === 3) {
          stepHtml = `
            <div class="wizard-step">
              <div class="wizard-icon">☁️</div>
              <span class="step-pill" style="background:#c6f6d5; color:#22543d;">STEP 3 OF 3: SYNCING</span>
              <h2 class="wizard-title" id="sync-title">Connecting to Google Drive...</h2>
              <p class="wizard-desc" id="sync-desc">Establishing secure handshake with /JwellersEdith_Sync/ on your 15 GB free Drive storage.</p>
              
              <div class="progress-track">
                <div class="progress-bar" id="wiz-bar"></div>
              </div>

              <div id="sync-log" style="text-align:left; background:var(--bg-card); padding:12px; border-radius:10px; font-size:12px; font-family:monospace; line-height:1.6; border:1px solid var(--border); max-height:140px; overflow-y:auto;">
                <div>⏳ Handshaking with JWELL-EDIT-8899...</div>
              </div>
            </div>
          `;
        }

        return `
          <div class="app-content" style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
            <div class="card" style="width:100%; border:none; box-shadow:none; background:transparent;">
              ${stepHtml}
            </div>
          </div>
        `;
      },

      startSyncProcess() {
        State.pairingCode = document.getElementById('wiz-code')?.value.trim() || 'JWELL-EDIT-8899';
        State.accountEmail = document.getElementById('wiz-email')?.value.trim() || 'owner.jeweller@gmail.com';
        this._wizardStep = 3;
        this.render();

        const bar = document.getElementById('wiz-bar');
        const log = document.getElementById('sync-log');
        const title = document.getElementById('sync-title');
        const desc = document.getElementById('sync-desc');

        setTimeout(() => {
          if (bar) bar.style.width = '35%';
          if (log) log.innerHTML += '<div>✅ Google Drive Authenticated: ' + State.accountEmail + '</div>';
        }, 600);

        setTimeout(() => {
          if (bar) bar.style.width = '75%';
          if (log) log.innerHTML += '<div>📥 Downloading Khata balances & bills...</div><div>📥 Downloading Girvi pledge tickets...</div>';
        }, 1300);

        setTimeout(() => {
          if (bar) bar.style.width = '100%';
          if (title) title.textContent = '🎉 All Synced & Ready!';
          if (desc) desc.textContent = 'Your mobile device is now paired and 100% offline-ready.';
          if (log) log.innerHTML += '<div style="color:var(--success); font-weight:700;">✅ Handshake Complete! Passbook & Girvi ready.</div>';
          State.isPaired = true;
          State.isDemoMode = false;
          State.lastSyncedAt = new Date().toLocaleTimeString();
          MobileApp.saveState();
          setTimeout(() => {
            MobileApp.navigate('dashboard');
          }, 900);
        }, 2100);
      },

      resetOnboarding() {
        State.isPaired = false;
        State.isDemoMode = false;
        this._wizardStep = 1;
        this.saveState();
        this.render();
      },

      showSyncSheet() {
        const modalHtml = `
          <div class="modal-backdrop" onclick="document.getElementById('sync-sheet').remove()" id="sync-sheet">
            <div class="modal-sheet" onclick="event.stopPropagation()">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3 style="font-size:17px; font-weight:800;">☁️ Google Drive Live Sync</h3>
                <button class="btn btn-sm btn-secondary" onclick="document.getElementById('sync-sheet').remove()">✕</button>
              </div>
              <div style="background:var(--bg-app); padding:14px; border-radius:12px; font-size:13px; line-height:1.6; margin-bottom:14px;">
                <div>Account: <strong>${State.accountEmail || 'owner.jeweller@gmail.com'}</strong></div>
                <div>Sync Folder: <code>/JwellersEdith_Sync/</code></div>
                <div>Status: <strong style="color:var(--success);">🟢 Connected & Synced</strong></div>
                <div>Last Synchronized: <strong>${State.lastSyncedAt || 'Just Now'}</strong></div>
              </div>
              <button class="btn btn-primary btn-block" style="padding:14px;" onclick="MobileApp.triggerInstantSync()">
                🔄 Fetch Latest Updates from PC
              </button>
              <button class="btn btn-secondary btn-block" style="margin-top:10px;" onclick="document.getElementById('sync-sheet').remove()">
                Close
              </button>
            </div>
          </div>
        `;
        document.getElementById('modal-host').innerHTML = modalHtml;
      },

      triggerInstantSync() {
        const sheet = document.getElementById('sync-sheet');
        if (sheet) sheet.remove();
        alert('🔄 Delta sync completed! Local Khata & Girvi caches are 100% up-to-date.');
        State.lastSyncedAt = new Date().toLocaleTimeString();
        this.saveState();
        this.render();
      },

      sendWhatsApp(phone, name, dues) {
        let msg = `Namaste *${name} ji* 🙏\n\nThis is a polite reminder regarding your outstanding Khata balance at *Jwellers Edith*.\n\n• *Pending Balance Dues:* ₹${Number(dues).toLocaleString('en-IN')}\n• *Shop UPI ID:* \`${State.shopUpiId}\`\n\nKindly clear your dues at your earliest convenience.\n\nThank you!\n- *Jwellers Edith*`;
        const p = String(phone).replace(/\D/g, '');
        window.open(`https://api.whatsapp.com/send?phone=91${p}&text=${encodeURIComponent(msg)}`, '_blank');
      },

      showUpiQr(name, dues) {
        const uri = `upi://pay?pa=${encodeURIComponent(State.shopUpiId)}&pn=Jwellers%20Edith&am=${parseFloat(dues).toFixed(2)}&cu=INR&tn=${encodeURIComponent('Khata Dues - ' + name)}`;
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(uri)}`;

        const modalHtml = `
          <div class="modal-backdrop" id="upi-modal" onclick="document.getElementById('upi-modal').remove()">
            <div class="modal-sheet" onclick="event.stopPropagation()">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                <h3 style="font-size:16px; font-weight:800;">💳 Customer Instant UPI Payment</h3>
                <button class="btn btn-sm btn-secondary" onclick="document.getElementById('upi-modal').remove()">✕</button>
              </div>
              <div style="text-align:center; padding:10px 0;">
                <img src="${qrUrl}" alt="UPI QR" style="width:230px; height:230px; border-radius:12px; border:2px solid var(--border);" />
                <div style="font-weight:800; font-size:24px; color:var(--primary); margin-top:12px;">₹${Number(dues).toLocaleString('en-IN')}</div>
                <div style="font-size:13px; color:var(--text-muted); margin-top:2px;">Scan with GPay, PhonePe, Paytm or any UPI App</div>
                <div style="font-size:12px; font-family:monospace; background:var(--bg-app); padding:6px 12px; border-radius:6px; margin-top:10px; display:inline-block;">${State.shopUpiId}</div>
              </div>
              <button class="btn btn-secondary btn-block" style="margin-top:16px;" onclick="document.getElementById('upi-modal').remove()">Close</button>
            </div>
          </div>
        `;
        document.getElementById('modal-host').innerHTML = modalHtml;
      },

      attachPhoto(loanNo) {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
        input.onchange = (e) => {
          if (e.target.files[0]) alert(`📸 Photo captured for Ticket #${loanNo} and queued for Google Drive Sync!`);
        };
        input.click();
      }
    };

    document.addEventListener('DOMContentLoaded', () => MobileApp.init());
  </script>
</body>
</html>
