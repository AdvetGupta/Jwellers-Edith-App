<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#c59b27">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Jwellers Edith — Mobile Companion</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --primary: #c59b27;
      --primary-dark: #9a7818;
      --primary-light: #fdf8e9;
      --bg-app: #f1f4f8;
      --bg-card: #ffffff;
      --text-main: #1a202c;
      --text-muted: #718096;
      --border: #e2e8f0;
      --success: #27ae60;
      --danger: #e53e3e;
      --warning: #dd6b20;
      --info: #3182ce;
      --radius: 14px;
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
      --shadow: 0 6px 16px rgba(0,0,0,0.06);
    }

    [data-theme="dark"] {
      --bg-app: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary-light: #2d2614;
      --shadow-sm: 0 2px 6px rgba(0,0,0,0.25);
      --shadow: 0 6px 20px rgba(0,0,0,0.35);
    }

    * {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    body { background: #0b0f19; color: var(--text-main); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
    
    #mobile-frame {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background: var(--bg-app);
      position: relative;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      padding-bottom: 75px;
    }

    .app-header {
      position: sticky; top: 0;
      background: var(--bg-card);
      padding: 12px 18px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .app-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; color: var(--primary-dark); }
    [data-theme="dark"] .app-logo { color: var(--primary); }
    .app-logo img { width: 24px; height: 24px; border-radius: 6px; }
    
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .theme-toggle-btn {
      background: var(--bg-app); border: 1px solid var(--border);
      color: var(--text-main); font-size: 14px; width: 32px; height: 32px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    .sync-status-pill {
      font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 20px;
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      background: #e6fffa; color: #234e52; border: 1px solid #b2f5ea;
    }
    [data-theme="dark"] .sync-status-pill { background: #064e3b; color: #a7f3d0; border-color: #047857; }
    .sync-status-pill.unpaired { background: #edf2f7; color: #4a5568; border-color: #cbd5e0; }
    [data-theme="dark"] .sync-status-pill.unpaired { background: #1e293b; color: #94a3b8; border-color: #334155; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
    .unpaired .dot { background: var(--text-muted); }

    .app-content { padding: 16px; flex: 1; overflow-y: auto; }

    .bottom-nav {
      position: fixed; bottom: 0; width: 100%; max-width: 440px;
      background: var(--bg-card); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 10px 0;
      z-index: 200; box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; border: none; background: none; color: var(--text-muted);
      font-size: 11px; font-weight: 700; cursor: pointer; flex: 1;
    }
    .nav-btn.active { color: var(--primary); }
    .nav-btn .icon { font-size: 20px; }

    .card {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 16px; margin-bottom: 14px; border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .stat-card {
      background: var(--bg-card); padding: 14px; border-radius: var(--radius);
      border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    }
    .stat-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .stat-num { font-size: 20px; font-weight: 800; margin-top: 4px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 10px 16px; border-radius: 10px; font-size: 13px;
      font-weight: 700; border: none; cursor: pointer; text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:active { background: var(--primary-dark); }
    .btn-secondary { background: var(--bg-app); color: var(--text-main); border: 1px solid var(--border); }
    .btn-whatsapp { background: #25d366; color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-block { width: 100%; padding: 12px; font-size: 14px; }
    .search-box { position: relative; margin-bottom: 14px; }
    .search-icon { position: absolute; left: 12px; top: 12px; color: var(--text-muted); }
    .search-input {
      width: 100%; padding: 12px 14px 12px 38px; border-radius: 10px;
      border: 1px solid var(--border); font-size: 14px; background: var(--bg-card);
      color: var(--text-main); outline: none;
    }
    .search-input:focus { border-color: var(--primary); }

    .modal-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); display: flex; align-items: flex-end; justify-content: center;
      z-index: 500;
    }
    .modal-sheet {
      background: var(--bg-card); width: 100%; max-width: 440px;
      border-top-left-radius: 20px; border-top-right-radius: 20px;
      padding: 24px 20px 32px 20px; max-height: 88vh; overflow-y: auto;
      animation: slideIn 0.25s ease-out;
    }
    @keyframes slideIn { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .wizard-step { text-align: center; padding: 20px 0; }
    .wizard-icon img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 12px; }
    .wizard-title { font-size: 20px; font-weight: 800; color: var(--text-main); margin-bottom: 6px; }
    .wizard-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }
    .step-pill { display: inline-block; padding: 4px 12px; border-radius: 12px; background: var(--primary-light); color: var(--primary); font-size: 11px; font-weight: 800; margin-bottom: 14px; }
    .progress-track { height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 16px 0; }
    .progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.4s ease; }
  </style>
</head>
<body>
  <div id="mobile-frame"></div>
  <div id="modal-host"></div>

  <script>
    // --- Master Mobile State & Realistic Jewel Store Ledger ---
    const State = {
      isPaired: false,
      pairingCode: 'JWELL-EDIT-8899',
      accountEmail: '',
      driveFolder: '/JwellersEdith_Sync/',
      driveShareUrl: '',    // Google Drive direct-download URL for auto-sync
      shopUpiId: '',
      lastSyncedAt: null,
      currentScreen: 'dashboard',
      lang: 'en',
      theme: 'light',
      rates: {
        gold22k: 71200,
        gold24k: 77500,
        silver1kg: 89400,
        isCustom: false,
        lastUpdated: 'Live Market'
      },
      khataList: [],
      girviList: [],
      customers: []
    };

    // --- Bilingual Dictionary ---
    const I18N = {
      t(k) {
        const dict = {
          en: {
            appName: "Jwellers Edith", dashboard: "Dashboard", khata: "Khata", girvi: "Girvi",
            customers: "Customers", settings: "Settings", pairPC: "Pair PC", connected: "Connected",
            goldRate: "Today Gold 22K (10g)", silverRate: "Today Silver (1kg)",
            activeKhataDues: "Active Khata Dues", activeGirvi: "Active Girvi",
            goldPledged: "Gold Pledged", silverPledged: "Silver Pledged",
            searchKhata: "Search customer or phone...", searchGirvi: "Search Girvi #, name, phone...",
            whatsappReminder: "WhatsApp", upiQr: "UPI QR", details: "Passbook", pay: "Pay", photo: "Photo",
            theme: "Appearance / थीम", light: "☀️ Light Mode", dark: "🌙 Dark Mode",
            editRates: "Edit Rates", liveBadge: "LIVE MARKET"
          },
          hi: {
            appName: "ज्वेलर्स एडिथ", dashboard: "डैशबोर्ड", khata: "खाता", girvi: "गिरवी",
            customers: "ग्राहक", settings: "सेटिंग्स", pairPC: "पीसी जोड़ें", connected: "जुड़ा हुआ",
            goldRate: "आज सोना भाव (22K)", silverRate: "आज चांदी भाव (1kg)",
            activeKhataDues: "कुल खाता बकाया", activeGirvi: "सक्रिय गिरवी",
            goldPledged: "जमा सोना (ग्राम)", silverPledged: "जमा चांदी (ग्राम)",
            searchKhata: "ग्राहक या फोन नंबर खोजें...", searchGirvi: "गिरवी नं., नाम, फोन खोजें...",
            whatsappReminder: "व्हाट्सएप", upiQr: "UPI QR", details: "पासबुक", pay: "जमा लें", photo: "फोटो",
            theme: "थीम / Appearance", light: "☀️ लाइट मोड", dark: "🌙 डार्क मोड",
            editRates: "भाव बदलें", liveBadge: "लाइव बाज़ार"
          }
        };
        return (dict[State.lang] && dict[State.lang][k]) || k;
      }
    };

    // --- Mobile Application Coordinator ---
    const MobileApp = {
      _wizardStep: 1,

      init() {
        try {
          const saved = localStorage.getItem('je_mobile_state');
          if (saved) {
            const parsed = JSON.parse(saved);
            Object.assign(State, parsed);
          }
        } catch(e) {}

        // Purge any stale mock records from localStorage
        const hasMockKhata = Array.isArray(State.khataList) && State.khataList.some(k => k.name === 'Ramesh Patel' && k.phone === '9822112233');
        const hasMockGirvi = Array.isArray(State.girviList) && State.girviList.some(g => g.loan_number === 'GIR-1001');
        if (hasMockKhata || hasMockGirvi) {
          State.khataList = [];
          State.girviList = [];
          State.customers = [];
          this.saveState();
        }

        this.applyTheme(State.theme || 'light');
        this.fetchLiveMarketRates();
        this.render();

        // Background Auto-Sync whenever app opens or gains focus
        window.addEventListener('focus', () => this.autoBackgroundSync());
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') this.autoBackgroundSync();
        });

        // Periodic background pulse every 3 minutes
        setInterval(() => this.autoBackgroundSync(), 180000);
      },

      cleanDriveUrl(url) {
        if (!url) return '';
        url = url.trim();
        // Convert Google Drive sharing link: https://drive.google.com/file/d/FILE_ID/view... -> direct download
        const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          return `https://drive.google.com/uc?export=download&id=${match[1]}`;
        }
        const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1] && !url.includes('export=download')) {
          return `https://drive.google.com/uc?export=download&id=${idMatch[1]}`;
        }
        return url;
      },

      async autoBackgroundSync(manualTrigger = false) {
        let rawUrl = State.driveShareUrl || '';
        if (!rawUrl) {
          if (manualTrigger) {
            alert('⚠️ No Google Drive URL configured yet.\nPlease paste your Google Drive link or select your ledger_snapshot.json file.');
            this.navigate('settings');
          }
          return false;
        }
        const url = this.cleanDriveUrl(rawUrl);
        try {
          const resp = await fetch(url, { cache: 'no-store' });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const snapshot = await resp.json();
          if (snapshot && (snapshot.girviList || snapshot.khataList || snapshot.customers)) {
            let countGirvi = 0;
            let countKhata = 0;
            let countCust = 0;

            if (Array.isArray(snapshot.girviList)) {
              State.girviList = snapshot.girviList.sort((a, b) => (b.id || 0) - (a.id || 0));
              countGirvi = State.girviList.length;
            }
            if (Array.isArray(snapshot.khataList)) {
              State.khataList = snapshot.khataList;
              countKhata = State.khataList.length;
            }
            if (Array.isArray(snapshot.customers)) {
              State.customers = snapshot.customers;
              countCust = State.customers.length;
            }
            if (snapshot.rates) State.rates = { ...State.rates, ...snapshot.rates };
            State.lastSyncedAt = snapshot.exportedAt || new Date().toISOString();
            State.isPaired = true;
            this.saveState();
            this.render();
            if (manualTrigger) {
              alert(`🎉 Synced Successfully!\n\n• ${countCust} Customers\n• ${countGirvi} Girvi Loans\n• ${countKhata} Khata Accounts`);
            }
            return true;
          }
        } catch (e) {
          if (manualTrigger) {
            alert(`⚠️ Could not download snapshot from Drive link (${e.message}).\n\nTip: You can also select the "ledger_snapshot.json" file directly.`);
            const fileInput = document.getElementById('snapshot-file-input') || document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.json';
            fileInput.style.display = 'none';
            fileInput.onchange = (ev) => this.importSnapshotFromFile(ev);
            document.body.appendChild(fileInput);
            fileInput.click();
          }
        }
        return false;
      },

      // --- Live Real-Time Bullion Rates Engine ---
      async fetchLiveMarketRates() {
        if (State.rates && State.rates.isCustom) return; // Jewelers custom rate takes precedence if manually set
        try {
          const res = await fetch('https://api.gold-api.com/price/XAU');
          if (res.ok) {
            const data = await res.json();
            if (data && data.price) {
              const usdInr = 87.5;
              const importDutyGstFactor = 1.15;
              const gold22k = Math.round((data.price / 31.1034768) * (22/24) * 10 * usdInr * importDutyGstFactor);
              State.rates.gold22k = gold22k;
              State.rates.gold24k = Math.round(gold22k * (24/22));
              State.rates.lastUpdated = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              this.saveState();
              this.render();
            }
          }
        } catch(e) {
          // Gracefully falls back to offline cache
        }
      },

      openRateModal() {
        const modalHtml = `
          <div class="modal-backdrop" id="rate-modal" onclick="document.getElementById('rate-modal').remove()">
            <div class="modal-sheet" onclick="event.stopPropagation()">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                <h3 style="font-size:17px; font-weight:800;">💰 Today's Shop Bullion Rates</h3>
                <button class="btn btn-sm btn-secondary" onclick="document.getElementById('rate-modal').remove()">✕</button>
              </div>
              <p style="font-size:13px; color:var(--text-muted); margin-bottom:14px; line-height:1.4;">
                Set your daily counter selling rates for Gold & Silver, or fetch the latest live bullion market spot.
              </p>

              <div style="margin-bottom:12px;">
                <label style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase;">Gold 22K Rate (per 10 grams)</label>
                <input type="number" id="gold-22k-input" class="search-input" style="padding-left:14px; font-size:16px; font-weight:700; margin-top:4px;" value="${State.rates.gold22k}">
              </div>

              <div style="margin-bottom:12px;">
                <label style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase;">Silver Rate (per 1 kg)</label>
                <input type="number" id="silver-1kg-input" class="search-input" style="padding-left:14px; font-size:16px; font-weight:700; margin-top:4px;" value="${State.rates.silver1kg}">
              </div>

              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px;">
                <button class="btn btn-primary" onclick="MobileApp.saveCustomRates()">
                  💾 Save Shop Rates
                </button>
                <button class="btn btn-secondary" onclick="MobileApp.resetToLiveRates()">
                  🔄 Fetch Live MCX Spot
                </button>
              </div>
            </div>
          </div>
        `;
        document.getElementById('modal-host').innerHTML = modalHtml;
      },

      saveCustomRates() {
        const g = parseFloat(document.getElementById('gold-22k-input')?.value || 0);
        const s = parseFloat(document.getElementById('silver-1kg-input')?.value || 0);
        if (g > 0 && s > 0) {
          State.rates.gold22k = g;
          State.rates.silver1kg = s;
          State.rates.isCustom = true;
          State.rates.lastUpdated = 'Shop Custom Rate';
          this.saveState();
          document.getElementById('rate-modal')?.remove();
          this.render();
        }
      },

      async resetToLiveRates() {
        State.rates.isCustom = false;
        document.getElementById('rate-modal')?.remove();
        await this.fetchLiveMarketRates();
        alert('🔄 Live Bullion Market Rates Updated!');
        this.render();
      },

      applyTheme(t) {
        State.theme = t;
        document.documentElement.setAttribute('data-theme', t);
        this.saveState();
      },

      toggleTheme() {
        const next = State.theme === 'dark' ? 'light' : 'dark';
        this.applyTheme(next);
        this.render();
      },

      saveState() {
        try {
          localStorage.setItem('je_mobile_state', JSON.stringify({
            isPaired: State.isPaired,
            accountEmail: State.accountEmail,
            pairingCode: State.pairingCode,
            driveShareUrl: State.driveShareUrl,
            shopUpiId: State.shopUpiId,
            lastSyncedAt: State.lastSyncedAt,
            lang: State.lang,
            theme: State.theme,
            rates: State.rates,
            khataList: State.khataList,
            girviList: State.girviList,
            customers: State.customers
          }));
        } catch(e) {}
      },

      navigate(screen) {
        State.currentScreen = screen;
        this.render();
        window.scrollTo(0, 0);
      },

      render() {
        const frame = document.getElementById('mobile-frame');
        if (!frame) return;

        if (!State.isPaired) {
          frame.innerHTML = this._renderOnboardingWizard();
          return;
        }

        frame.innerHTML = `
          <header class="app-header">
            <div class="app-logo">
              <img src="icon.png" alt="Logo" />
              <span>${I18N.t('appName')}</span>
            </div>
            <div class="header-actions">
              <button class="theme-toggle-btn" onclick="MobileApp.toggleTheme()" title="Toggle Dark/Light">
                ${State.theme === 'dark' ? '☀️' : '🌙'}
              </button>
              <div class="sync-status-pill" onclick="MobileApp.showSyncSheet()">
                <span class="dot"></span>
                <span>${I18N.t('connected')}</span>
              </div>
            </div>
          </header>

          <main class="app-content" id="app-content-area">
            ${this._renderScreenContent()}
          </main>

          <nav class="bottom-nav">
            <button class="nav-btn ${State.currentScreen === 'dashboard' ? 'active' : ''}" onclick="MobileApp.navigate('dashboard')">
              <span class="icon">◉</span><span>${I18N.t('dashboard')}</span>
            </button>
            <button class="nav-btn ${State.currentScreen === 'khata' ? 'active' : ''}" onclick="MobileApp.navigate('khata')">
              <span class="icon">📒</span><span>${I18N.t('khata')}</span>
            </button>
            <button class="nav-btn ${State.currentScreen === 'girvi' ? 'active' : ''}" onclick="MobileApp.navigate('girvi')">
              <span class="icon">💍</span><span>${I18N.t('girvi')}</span>
            </button>
            <button class="nav-btn ${State.currentScreen === 'customers' ? 'active' : ''}" onclick="MobileApp.navigate('customers')">
              <span class="icon">👥</span><span>${I18N.t('customers')}</span>
            </button>
            <button class="nav-btn ${State.currentScreen === 'settings' ? 'active' : ''}" onclick="MobileApp.navigate('settings')">
              <span class="icon">⚙</span><span>${I18N.t('settings')}</span>
            </button>
          </nav>
        `;
      },

      _renderScreenContent() {
        switch(State.currentScreen) {
          case 'khata': return this._renderKhata();
          case 'girvi': return this._renderGirvi();
          case 'customers': return this._renderCustomers();
          case 'settings': return this._renderSettings();
          default: return this._renderDashboard();
        }
      },

      _renderDashboard() {
        const totalKhata = State.khataList.reduce((s, c) => s + (c.dues || 0), 0);
        const totalGirvi = State.girviList.reduce((s, g) => s + (g.principal_amount || 0), 0);
        const goldWt = State.girviList.reduce((s, g) => s + (g.gold_weight || 0), 0);
        const silverWt = State.girviList.reduce((s, g) => s + (g.silver_weight || 0), 0);
        const goldRate = State.rates ? State.rates.gold22k : 71200;
        const silverRate = State.rates ? State.rates.silver1kg : 89400;

        return `
          <div class="card" style="border-left: 4px solid var(--primary); cursor:pointer;" onclick="MobileApp.openRateModal()">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-size:11px; font-weight:700; color:var(--primary);">${I18N.t('goldRate')}</div>
                <div style="font-size:18px; font-weight:800; margin-top:2px;">₹${goldRate.toLocaleString('en-IN')}</div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:11px; font-weight:700; color:var(--info);">${I18N.t('silverRate')}</div>
                <div style="font-size:18px; font-weight:800; margin-top:2px;">₹${silverRate.toLocaleString('en-IN')}</div>
              </div>
            </div>

              ${lastJama ? `
                <div style="font-size:11px; color:var(--text-muted); margin-top:6px;">

                <button class="btn btn-secondary" style="font-size:11px; padding:7px;" onclick="MobileApp.openKhataPassbook(${c.id})">
                  📖 ${I18N.t('details')}
                </button>
                <button class="btn btn-whatsapp" style="font-size:11px; padding:7px;" onclick="MobileApp.sendWhatsApp('${c.phone}', '${c.name}', ${c.dues})">
                  📲 ${I18N.t('whatsappReminder')}

                <button class="btn btn-primary" style="font-size:11px; padding:7px;" onclick="MobileApp.showUpiQr('${c.name}', ${c.dues})">
                  💳 ${I18N.t('upiQr')}

              ${c.transactions && c.transactions.length > 0 ? `

                  </div>
                  <div style="display:flex; justify-content:space-between; color:var(--text-muted); font-size:11px; margin-top:2px;">
                    <span>📅 ${t.date || ''}</span>
                    <span>Bal: <strong>₹${Number(t.balance || 0).toLocaleString('en-IN')}</strong></span>

              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px;">

      _renderGirvi() {
        return `
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="girvi-search-box" class="search-input" placeholder="${I18N.t('searchGirvi')}" oninput="MobileApp.filterGirvi(this.value)">
          </div>
          <div id="girvi-items-container">
            ${this._generateGirviHtml('')}
          </div>
        `;
      },

      filterGirvi(query) {
        const container = document.getElementById('girvi-items-container');
        if (container) container.innerHTML = this._generateGirviHtml(query);
      },

      _generateGirviHtml(query) {
        const q = (query || '').toLowerCase().trim();
        const filtered = State.girviList.filter(g => !q || g.loan_number.toLowerCase().includes(q) || g.customer_name.toLowerCase().includes(q) || (g.caste && g.caste.toLowerCase().includes(q)) || g.phone1.includes(q) || g.address.toLowerCase().includes(q));

        if (filtered.length === 0) {
          return `<div class="card" style="text-align:center; padding:30px; color:var(--text-muted);">No matching Girvi pledges found</div>`;
        }

        return filtered.map(g => {
          const wt = g.metal_type === 'gold' ? `${g.gold_weight}g Gold` : g.metal_type === 'silver' ? `${g.silver_weight}g Silver` : `${g.gold_weight}g Au / ${g.silver_weight}g Ag`;
          const days = g.accruedDays || 60;
          const m = Math.floor(days / 30);
          const d = days % 30;

          // Calculate SI and CI for display from snapshot data
          const principal = g.principal_amount || 0;
          const rate = g.monthly_interest_percent || 2.0;
          const snDays = g.accruedDays || (g.billableMonths || 0) * 30 || 60;
          const mElapsed = Math.floor(snDays / 30);
          const dRem = snDays % 30;
          let bMonths = mElapsed + (dRem >= 15 ? 1 : 0);
          if (bMonths < 1) bMonths = 1;
          const siDisplay = g.simpleInterest !== undefined ? g.simpleInterest : Math.round((principal * rate * bMonths) / 100 * 100) / 100;
          const ciDisplay = g.compoundInterest !== undefined ? g.compoundInterest : siDisplay;
          const iType = g.interest_type || 'simple';
          const chargedDisplay = iType === 'compound' ? ciDisplay : siDisplay;

          return `
            <div class="card" style="border-left: 4px solid var(--primary);">
              <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                  <div style="font-size:12px; font-weight:800; color:var(--primary);">${g.loan_number}</div>
                  <div style="font-weight:700; font-size:15px; margin-top:2px;">${g.customer_name}</div>
                  ${g.caste ? `<div style="font-size:11px; font-weight:700; color:var(--primary); margin-top:1px;">🏷️ Caste (जाति): ${g.caste}</div>` : ''}
                  <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">📍 ${g.address} • 📞 ${g.phone1}</div>
                </div>
                <div style="text-align:right;">
                  <div style="font-size:11px; font-weight:700; color:var(--text-muted);">PRINCIPAL (मूलधन)</div>
                  <div style="font-size:17px; font-weight:800; color:var(--primary); margin-top:2px;">₹${principal.toLocaleString('en-IN')}</div>
                  <div style="font-size:11px; color:var(--text-muted);">${rate}% /mo</div>
                  <div style="font-size:10px; color:${iType === 'compound' ? '#e67e22' : 'var(--success)'}; font-weight:700; margin-top:2px;">
                    ${iType === 'compound' ? '⚡ Compound' : '✅ Simple'}
                  </div>
                </div>
              </div>

              <div style="background:var(--bg-app); padding:8px 12px; border-radius:8px; margin-top:10px; font-size:13px; display:flex; justify-content:space-between; align-items:center;">
                <span>💎 <strong>${g.item_name}</strong></span>
                <span>⚖️ <strong>${wt}</strong></span>
              </div>

              <!-- Dual Interest Display -->
              <div style="background:var(--bg-app); padding:8px 12px; border-radius:8px; margin-top:6px; font-size:12px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:3px;">
                  <span style="color:var(--success);">✅ साधारण ब्याज (SI): <strong>₹${siDisplay.toLocaleString('en-IN')}</strong></span>
                  <span style="color:#e67e22;">⚡ चक्रवर्ती (CI): <strong>₹${ciDisplay.toLocaleString('en-IN')}</strong></span>
                </div>
                <div style="font-size:11px; color:var(--text-muted);">⏳ ${m}m ${d}d &nbsp;|&nbsp; Charged (लागू): <strong style="color:var(--danger);">₹${chargedDisplay.toLocaleString('en-IN')}</strong></div>
              </div>

              ${g.reference_person ? `<div style="font-size:12px; color:var(--text-muted); margin-top:4px;">🤝 Reference: <strong>${g.reference_person}</strong></div>` : ''}

              <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:6px; margin-top:12px; border-top:1px solid var(--border); padding-top:10px;">
                <button class="btn btn-secondary" style="font-size:11px; padding:6px;" onclick="MobileApp.viewGirvi('${g.loan_number}')">
                  👁️ ${I18N.t('details')}
                </button>
                <button class="btn btn-primary" style="font-size:11px; padding:6px;" onclick="MobileApp.openGirviPayModal('${g.loan_number}')">
                  💳 ${I18N.t('pay')}
                </button>
                <button class="btn btn-secondary" style="font-size:11px; padding:6px;" onclick="MobileApp.attachPhoto('${g.loan_number}')">
                  📸 ${I18N.t('photo')}
                </button>
                <button class="btn btn-whatsapp" style="font-size:11px; padding:6px;" onclick="MobileApp.sendGirviWhatsApp('${g.phone1}', '${g.customer_name}', '${g.loan_number}', ${g.totalDues || g.principal_amount})">
                  📲 WA
                </button>
              </div>
            </div>
          `;
        }).join('');
      },

        const g = State.girviList.find(x => x.loan_number === loanNo);
        if (!g) return;

        const days = g.accruedDays || 60;
        const m = Math.floor(days / 30);

                <div><strong>Interest Type:</strong> <span style="color:${iTypeModal === 'compound' ? '#e67e22' : 'var(--success)'}; font-weight:700;">${iTypeModal === 'compound' ? '⚡ Compound (चक्रवर्ती)' : '✅ Simple (साधारण)'}</span></div>
                <div><strong>Pledge Date (दिनांक):</strong> ${g.loan_date}</div>

                <!-- Interest Comparison -->
                <div style="background:var(--bg-app); padding:10px 12px; border-radius:8px; margin-bottom:6px;">
                  <div style="font-weight:700; font-size:12px; margin-bottom:6px; color:var(--text-muted);">INTEREST BREAKDOWN (ब्याज विवरण)</div>
                  <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;">
                    <span>✅ साधारण ब्याज (SI):</span>
                    <strong style="color:var(--success);">₹${siModal.toLocaleString('en-IN')}</strong>
                  </div>
                  <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;">
                    <span>⚡ चक्रवर्ती ब्याज (CI):</span>
                    <strong style="color:#e67e22;">₹${ciModal.toLocaleString('en-IN')}</strong>
                  </div>
                  <div style="display:flex; justify-content:space-between; font-size:13px; border-top:1px dashed var(--border); padding-top:6px; margin-top:4px;">
                    <span><strong>Charged (लागू ब्याज):</strong></span>
                    <strong style="color:var(--danger); font-size:15px;">₹${chargedModal.toLocaleString('en-IN')}</strong>
                  </div>
                </div>
                <div><strong>Total Outstanding (कुल बकाया):</strong> <span style="color:var(--primary); font-weight:800; font-size:16px;">₹${(g.totalDues || g.principal_amount).toLocaleString('en-IN')}</span></div>
                ${g.reference_person ? `<div><strong>Reference (संदर्भ):</strong> ${g.reference_person}</div>` : ''}
                ${g.notes ? `<div><strong>Remarks (टिप्पणी):</strong> ${g.notes}</div>` : ''}
              </div>

              ${g.payments && g.payments.length > 0 ? `
                <div style="font-weight:800; font-size:12px; color:var(--text-muted); text-transform:uppercase; margin-top:8px; margin-bottom:6px;">

              ` : ''}

              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px;">
                <button class="btn btn-primary" onclick="document.getElementById('girvi-modal').remove(); MobileApp.openGirviPayModal('${g.loan_number}');">
                  💳 Record Payment
                </button>
                <button class="btn btn-secondary" onclick="MobileApp.attachPhoto('${g.loan_number}')">
                  📸 Attach Photo
                </button>
              </div>
              <button class="btn btn-secondary btn-block" style="margin-top:8px;" onclick="document.getElementById('girvi-modal').remove()">Close</button>
            </div>
          </div>
        `;
        document.getElementById('modal-host').innerHTML = modalHtml;
      },

      openGirviPayModal(loanNo) {
        const g = State.girviList.find(x => x.loan_number === loanNo);
        if (!g) return;

        const modalHtml = `
          <div class="modal-backdrop" id="girvi-pay-modal" onclick="document.getElementById('girvi-pay-modal').remove()">
            <div class="modal-sheet" onclick="event.stopPropagation()">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                <h3 style="font-size:16px; font-weight:800;">💳 Record Girvi Payment</h3>
                <button class="btn btn-sm btn-secondary" onclick="document.getElementById('girvi-pay-modal').remove()">✕</button>
              </div>
              <div style="font-size:13px; color:var(--text-muted); margin-bottom:12px;">
                Ticket <strong>#${g.loan_number}</strong> • ${g.customer_name}
              </div>

              <div style="margin-bottom:12px;">
                <label style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase;">Payment Amount (₹)</label>
                <input type="number" id="pay-amount-input" class="search-input" style="padding-left:14px; margin-top:4px; font-size:16px; font-weight:700;" value="${g.accruedInterest || 2000}">
              </div>

              <div style="margin-bottom:12px;">
                <label style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase;">Payment Type</label>
                <select id="pay-type-select" class="search-input" style="padding-left:14px; margin-top:4px;">
                  <option value="interest_payment">Interest Payment (ब्याज जमा)</option>
                  <option value="part_payment">Part Principal Payment (मूलधन जमा)</option>
                  <option value="full_redemption">Full Loan Settlement / Release (छुड़ाना)</option>
                </select>
              </div>

              <div style="margin-bottom:16px;">
                <label style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase;">Payment Mode</label>
                <select id="pay-mode-select" class="search-input" style="padding-left:14px; margin-top:4px;">
                  <option value="Cash">Cash (नकद)</option>
                  <option value="UPI">UPI (GPay / PhonePe / Paytm)</option>
                  <option value="Bank">Bank Transfer</option>
                </select>
              </div>

              <button class="btn btn-success btn-block" style="padding:14px;" onclick="MobileApp.submitGirviPayment('${g.loan_number}')">
                ✅ Save Payment & Queue for Sync
              </button>
              <button class="btn btn-secondary btn-block" style="margin-top:8px;" onclick="document.getElementById('girvi-pay-modal').remove()">
                Cancel
              </button>
            </div>
          </div>
        `;
        document.getElementById('modal-host').innerHTML = modalHtml;
      },

      submitGirviPayment(loanNo) {
        const amt = parseFloat(document.getElementById('pay-amount-input')?.value || 0);
        const mode = document.getElementById('pay-mode-select')?.value || 'Cash';
        const type = document.getElementById('pay-type-select')?.value || 'interest_payment';
        const g = State.girviList.find(x => x.loan_number === loanNo);
        if (g && amt > 0) {
          if (!g.payments) g.payments = [];
          g.payments.push({
            date: new Date().toISOString().split('T')[0],
            amount: amt,
            type,
            mode,
            note: 'Mobile app counter collection'
          });
          if (type === 'interest_payment') {
            g.accruedInterest = Math.max(0, (g.accruedInterest || 0) - amt);
          } else {
            g.principal_amount = Math.max(0, g.principal_amount - amt);
          }
          g.totalDues = g.principal_amount + (g.accruedInterest || 0);
          document.getElementById('girvi-pay-modal')?.remove();
          alert(`✅ Payment of ₹${amt.toLocaleString('en-IN')} recorded on Ticket #${loanNo} and queued for Google Drive Sync!`);
          this.filterGirvi(document.getElementById('girvi-search-box')?.value || '');
        }
      },

      sendGirviWhatsApp(phone, name, loanNo, dues) {
        let msg = `Namaste *${name} ji* 🙏\n\nThis is a statement regarding your Girvi Pledge ticket *#${loanNo}* at *Jwellers Edith*.\n\n• *Total Outstanding Balance:* ₹${Number(dues).toLocaleString('en-IN')}\n\nKindly contact or visit the shop for interest clearance or redemption.\n\nThank you!\n- *Jwellers Edith*`;
        const p = String(phone).replace(/\D/g, '');
        window.open(`https://api.whatsapp.com/send?phone=91${p}&text=${encodeURIComponent(msg)}`, '_blank');
      },

      _renderCustomers() {
        return `
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="cust-search-box" class="search-input" placeholder="Search customer directory..." oninput="MobileApp.filterCustomers(this.value)">
          </div>
          <div id="cust-items-container">
            ${this._generateCustomerHtml('')}
          </div>
        `;
      },

      filterCustomers(query) {
        const container = document.getElementById('cust-items-container');
        if (container) container.innerHTML = this._generateCustomerHtml(query);
      },

      _generateCustomerHtml(query) {
        const q = (query || '').toLowerCase().trim();
        const filtered = State.customers.filter(c => !q || c.name.toLowerCase().includes(q) || c.phone.includes(q) || c.city.toLowerCase().includes(q));

        if (filtered.length === 0) {
          return `<div class="card" style="text-align:center; padding:30px; color:var(--text-muted);">No customers found</div>`;
        }

        return filtered.map(c => `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-weight:700; font-size:15px;">${c.name}</div>
                <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">📍 ${c.city} • 📞 ${c.phone}</div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:11px; color:var(--text-muted);">Balance</div>
                <div style="font-weight:700; color:${c.balance > 0 ? 'var(--danger)' : 'var(--success)'}; font-size:14px;">₹${(c.balance || 0).toLocaleString('en-IN')}</div>
              </div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:12px; border-top:1px solid var(--border); padding-top:10px;">
              <a href="tel:${c.phone}" class="btn btn-secondary" style="font-size:12px; padding:8px;">📞 Call</a>
              <a href="sms:${c.phone}" class="btn btn-secondary" style="font-size:12px; padding:8px;">💬 SMS</a>
              <a href="https://api.whatsapp.com/send?phone=91${c.phone}" target="_blank" class="btn btn-whatsapp" style="font-size:12px; padding:8px;">📲 WhatsApp</a>
            </div>
          </div>
        `).join('');
      },

      _renderSettings() {
        return `
          <div class="card">
            <div style="font-weight:700; font-size:14px; margin-bottom:10px;">💰 ${I18N.t('goldRate')} & Bullion</div>
            <div style="font-size:13px; color:var(--text-muted); margin-bottom:10px;">
              Gold 22K (10g): <strong>₹${(State.rates.gold22k || 71200).toLocaleString('en-IN')}</strong> • Silver (1kg): <strong>₹${(State.rates.silver1kg || 89400).toLocaleString('en-IN')}</strong>
            </div>
            <button class="btn btn-secondary btn-block" onclick="MobileApp.openRateModal()">
              ✏️ Edit Shop Daily Rates / Live MCX
            </button>
          </div>

          <div class="card">
            <div style="font-weight:700; font-size:14px; margin-bottom:10px;">🌓 ${I18N.t('theme')}</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
              <button class="btn ${State.theme === 'light' ? 'btn-primary' : 'btn-secondary'}" onclick="MobileApp.applyTheme('light'); MobileApp.render();">${I18N.t('light')}</button>
              <button class="btn ${State.theme === 'dark' ? 'btn-primary' : 'btn-secondary'}" onclick="MobileApp.applyTheme('dark'); MobileApp.render();">${I18N.t('dark')}</button>
            </div>
          </div>

          <div class="card">
            <div style="font-weight:700; font-size:14px; margin-bottom:10px;">🌐 Language / भाषा</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
              <button class="btn ${State.lang === 'en' ? 'btn-primary' : 'btn-secondary'}" onclick="State.lang = 'en'; MobileApp.saveState(); MobileApp.render();">🇬🇧 English</button>
              <button class="btn ${State.lang === 'hi' ? 'btn-primary' : 'btn-secondary'}" onclick="State.lang = 'hi'; MobileApp.saveState(); MobileApp.render();">🇮🇳 हिंदी</button>
            </div>
          </div>

          <div class="card">
            <div style="font-weight:700; font-size:14px; margin-bottom:6px;">💳 Shop UPI ID (for QR codes)</div>
            <input type="text" id="upi-field" class="search-input" style="padding-left:14px;" placeholder="e.g. 9876543210@paytm" value="${State.shopUpiId || ''}">
            <button class="btn btn-secondary btn-block" style="margin-top:10px;" onclick="State.shopUpiId = document.getElementById('upi-field').value.trim(); MobileApp.saveState(); alert('✅ Saved UPI ID!');">💾 Save UPI ID</button>
          </div>

          <div class="card">
            <div style="font-weight:700; font-size:14px; margin-bottom:6px;">☁️ Desktop PC Pairing</div>
            <div style="font-size:13px; color:var(--text-muted); line-height:1.5;">
              <div>Status: <strong>${State.isPaired ? '🟢 Connected to PC' : '⚪ Unpaired'}</strong></div>
              <div>Account: <strong>${State.accountEmail || 'Your Shop Gmail'}</strong></div>
              <div>Pairing Code: <code>${State.pairingCode}</code></div>
            </div>
            <button class="btn btn-secondary btn-block" style="margin-top:12px;" onclick="MobileApp.resetOnboarding()">
              🔗 Re-pair / Disconnect Device
            </button>
          </div>

          <div class="card" style="border:1px solid var(--primary);">
            <div style="font-weight:700; font-size:14px; margin-bottom:6px;">☁️ Auto-Sync URL (Google Drive)</div>
            <div style="font-size:12px; color:var(--text-muted); margin-bottom:8px; line-height:1.5;">
              Paste the Google Drive <strong>direct-download link</strong> for <code>ledger_snapshot.json</code>.<br>
              App will auto-fetch data every time it opens.
            </div>
            <input type="url" id="drive-url-field" class="search-input" style="padding-left:14px; font-size:12px;"
              placeholder="https://drive.google.com/uc?id=...&export=download"
              value="${State.driveShareUrl || ''}">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;">
              <button class="btn btn-secondary" onclick="
                State.driveShareUrl = document.getElementById('drive-url-field').value.trim();
                MobileApp.saveState();
                alert('✅ Sync URL Saved! App will auto-sync on next open.');
              ">💾 Save URL</button>
              <button class="btn btn-primary" onclick="MobileApp.autoBackgroundSync().then(() => MobileApp.render());">🔄 Sync Now</button>
            </div>
            ${State.lastSyncedAt ? `<div style="font-size:11px; color:var(--text-muted); margin-top:8px;">Last synced: <strong>${new Date(State.lastSyncedAt).toLocaleString('en-IN', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</strong></div>` : ''}
          </div>

          <div style="text-align:center; padding:16px; font-size:12px; color:var(--text-muted); line-height:1.6;">
            <div style="font-weight:700; color:var(--primary);">Jwellers Edith — Mobile Companion</div>
            <div>Version 1.3.0 • An <strong>AD's Creation</strong> Product</div>
          </div>
        `;
      },


      _renderOnboardingWizard() {
        let stepHtml = `
          <div class="wizard-step">
            <div class="wizard-icon">
              <img src="icon.png" alt="Logo" />
            </div>
            <span class="step-pill">GOOGLE DRIVE CLOUD SYNC</span>
            <h2 class="wizard-title">Pair with Desktop PC</h2>
            <p class="wizard-desc">Connect with your desktop shop data via <strong>Google Drive link</strong> or by selecting <strong>ledger_snapshot.json</strong>.</p>
            
            <div style="text-align:left; margin:16px 0;">
              <label style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase;">Desktop Pairing Code</label>
              <input type="text" id="wiz-code" class="search-input" style="padding-left:14px; font-weight:800; font-size:15px; letter-spacing:1px; margin-top:4px;" placeholder="e.g. JWELL-EDIT-8899" value="${State.pairingCode || 'JWELL-EDIT-8899'}">

              <label style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase; margin-top:12px; display:block;">Your Real Shop Gmail</label>
              <input type="email" id="wiz-email" class="search-input" style="padding-left:14px; margin-top:4px;" placeholder="e.g. yourshop@gmail.com" value="${State.accountEmail || ''}">

              <label style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase; margin-top:12px; display:block;">Google Drive Share Link (Optional)</label>
              <input type="url" id="wiz-drive-url" class="search-input" style="padding-left:14px; font-size:12px; margin-top:4px;" placeholder="https://drive.google.com/file/d/.../view" value="${State.driveShareUrl || ''}">
              <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">* Link to ledger_snapshot.json from your Google Drive folder</div>
            </div>

            <input type="file" id="snapshot-file-input" accept=".json" style="display:none;" onchange="MobileApp.importSnapshotFromFile(event)">

            <button class="btn btn-primary btn-block" style="padding:14px; font-size:15px; font-weight:700; margin-bottom:10px;" onclick="MobileApp.startDriveSyncWithPermission()">
              🚀 Connect & Sync Data
            </button>

            <button class="btn btn-secondary btn-block" style="padding:12px; font-size:13px; font-weight:600;" onclick="document.getElementById('snapshot-file-input').click()">
              📁 Select ledger_snapshot.json File
            </button>
          </div>
        `;

        return `
          <div class="app-content" style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
            <div class="card" style="width:100%; border:none; box-shadow:none; background:transparent;">
              ${stepHtml}
            </div>
          </div>
        `;
      },

      async startDriveSyncWithPermission() {
        const codeInput = document.getElementById('wiz-code')?.value.trim() || 'JWELL-EDIT-8899';
        const emailInput = document.getElementById('wiz-email')?.value.trim();
        const driveUrlInput = document.getElementById('wiz-drive-url')?.value.trim();

        if (!emailInput || !emailInput.includes('@')) {
          alert('⚠️ Please enter your real Gmail address (e.g. yourshop@gmail.com) so the app can connect to your Google Drive!');
          return;
        }

        State.pairingCode = codeInput;
        State.accountEmail = emailInput;
        if (driveUrlInput) {
          State.driveShareUrl = driveUrlInput;
        }
        this.saveState();

        if (State.driveShareUrl) {
          const synced = await this.autoBackgroundSync(true);
          if (synced) {
            this.navigate('dashboard');
            return;
          }
        }

        // If no URL or direct fetch failed, offer file selection
        const fileInput = document.getElementById('snapshot-file-input');
        if (fileInput) {
          fileInput.click();
        }
      },

      resetOnboarding() {
        State.isPaired = false;
        this._wizardStep = 1;
        this.saveState();
        this.render();
      },

      importSnapshotFromFile(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            let countCust = 0;
            let countGirvi = 0;
            let countKhata = 0;

            if (Array.isArray(data.customers)) {
              State.customers = data.customers;
              countCust = data.customers.length;
            }
            if (Array.isArray(data.girviList)) {
              State.girviList = data.girviList;
              countGirvi = data.girviList.length;
            }
            if (Array.isArray(data.khataList)) {
              State.khataList = data.khataList;
              countKhata = data.khataList.length;
            } else if (Array.isArray(data.customers)) {
              State.khataList = data.customers.map(c => ({
                id: c.id,
                name: c.name,
                phone: c.phone || '',
                city: c.city || '',
                dues: c.balance || 0,
                totalPurchases: c.balance || 0,
                totalJama: 0,
                bills: [],
                jamaHistory: []
              }));
              countKhata = State.khataList.length;
            }
            if (data.rates) {
              State.rates = { ...State.rates, ...data.rates };
            }
            State.isPaired = true;
            State.lastSyncedAt = new Date().toLocaleTimeString();
            this.saveState();
            alert(`🎉 Data Transferred Successfully!\n\n• Loaded ${countCust} Customers\n• Loaded ${countGirvi} Girvi Loans\n• Loaded ${countKhata} Khata Accounts & Balances\n\nYour mobile companion is now 100% up-to-date with your shop!`);
            this.navigate('dashboard');
          } catch (err) {
            alert(`⚠️ Could not parse data file: ${err.message}`);
          }
        };
        reader.readAsText(file);
      },

      showSyncSheet() {
        const modalHtml = `
          <div class="modal-backdrop" onclick="document.getElementById('sync-sheet').remove()" id="sync-sheet">
            <div class="modal-sheet" onclick="event.stopPropagation()">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3 style="font-size:17px; font-weight:800;">☁️ Google Drive Live Sync</h3>
                <button class="btn btn-sm btn-secondary" onclick="document.getElementById('sync-sheet').remove()">✕</button>
              </div>
              <div style="background:var(--bg-app); padding:14px; border-radius:12px; font-size:13px; line-height:1.6; margin-bottom:14px;">
                <div>Account: <strong>${State.accountEmail || 'Your Shop Gmail'}</strong></div>
                <div>Sync Folder: <code>/JwellersEdith_Sync/</code></div>
                <div>Status: <strong style="color:var(--success);">🟢 Connected & Synced</strong></div>
                <div>Last Synchronized: <strong>${State.lastSyncedAt || 'Just Now'}</strong></div>
              </div>
              <button class="btn btn-primary btn-block" style="padding:14px;" onclick="MobileApp.triggerInstantSync()">
                🔄 Fetch Latest Updates from Google Drive
              </button>
              <button class="btn btn-secondary btn-block" style="margin-top:10px;" onclick="document.getElementById('sync-sheet').remove()">
                Close
              </button>
            </div>
          </div>
        `;
        document.getElementById('modal-host').innerHTML = modalHtml;
      },

      async triggerInstantSync() {
        const sheet = document.getElementById('sync-sheet');
        if (sheet) sheet.remove();

        if (State.driveShareUrl) {
          await this.autoBackgroundSync(true);
        } else {
          const fileInput = document.getElementById('snapshot-file-input') || document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = '.json';
          fileInput.style.display = 'none';
          fileInput.onchange = (e) => this.importSnapshotFromFile(e);
          document.body.appendChild(fileInput);
          fileInput.click();
        }
      },

      sendWhatsApp(phone, name, dues) {
        let msg = `Namaste *${name} ji* 🙏\n\nThis is a polite reminder regarding your outstanding Khata balance at *Jwellers Edith*.\n\n• *Pending Balance Dues:* ₹${Number(dues).toLocaleString('en-IN')}\n`;
        if (State.shopUpiId) msg += `• *Shop UPI ID:* \`${State.shopUpiId}\`\n`;
        msg += `\nKindly clear your dues at your earliest convenience.\n\nThank you!\n- *Jwellers Edith*`;
        const p = String(phone).replace(/\D/g, '');
        window.open(`https://api.whatsapp.com/send?phone=91${p}&text=${encodeURIComponent(msg)}`, '_blank');
      },

      showUpiQr(name, dues) {
        const upi = State.shopUpiId || 'owner.jeweller@upi';
        const uri = `upi://pay?pa=${encodeURIComponent(upi)}&pn=Jwellers%20Edith&am=${parseFloat(dues).toFixed(2)}&cu=INR&tn=${encodeURIComponent('Khata Dues - ' + name)}`;
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(uri)}`;

        const modalHtml = `
          <div class="modal-backdrop" id="upi-modal" onclick="document.getElementById('upi-modal').remove()">
            <div class="modal-sheet" onclick="event.stopPropagation()">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                <h3 style="font-size:16px; font-weight:800;">💳 Customer Instant UPI Payment</h3>
                <button class="btn btn-sm btn-secondary" onclick="document.getElementById('upi-modal').remove()">✕</button>
              </div>
              <div style="text-align:center; padding:10px 0;">
                <img src="${qrUrl}" alt="UPI QR" style="width:230px; height:230px; border-radius:12px; border:2px solid var(--border);" />
                <div style="font-weight:800; font-size:24px; color:var(--primary); margin-top:12px;">₹${Number(dues).toLocaleString('en-IN')}</div>
                <div style="font-size:13px; color:var(--text-muted); margin-top:2px;">Scan with GPay, PhonePe, Paytm or any UPI App</div>
                <div style="font-size:12px; font-family:monospace; background:var(--bg-app); padding:6px 12px; border-radius:6px; margin-top:10px; display:inline-block;">${upi}</div>
              </div>
              <button class="btn btn-secondary btn-block" style="margin-top:16px;" onclick="document.getElementById('upi-modal').remove()">Close</button>
            </div>
          </div>
        `;
        document.getElementById('modal-host').innerHTML = modalHtml;
      },

      attachPhoto(loanNo) {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
        input.onchange = (e) => {
          if (e.target.files[0]) alert(`📸 Photo captured for Ticket #${loanNo} and queued for Google Drive Sync!`);
        };
        input.click();
      }
    };

    document.addEventListener('DOMContentLoaded', () => MobileApp.init());
  </script>
</body>
</html>
